<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeDialog 台词审核</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#243044;font:16px/1.7 'Microsoft YaHei',sans-serif}main{max-width:1180px;margin:auto;padding:30px}h1{margin:0 0 10px}header,.row{background:white;border:1px solid #dce2eb;border-radius:10px;padding:22px;margin-bottom:16px}input,select,button,textarea{font:inherit;border:1px solid #c8d1df;border-radius:6px;padding:7px 10px;background:white}button{cursor:pointer}button:hover{background:#edf2fa}textarea{width:100%;min-height:90px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:14px 0;background:#f3f5f8;position:sticky;top:0;z-index:1}.toolbar input[type=search]{flex:1}.meta{display:flex;gap:12px;flex-wrap:wrap;color:#5d6980;font-size:13px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:14px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.label{color:#758197;font-size:12px}.row details{margin-top:14px}.editor{padding-top:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.status{color:#276344;font-size:13px;min-height:20px}video{width:100%;max-height:50vh;background:#111}video:not([src]){display:none}.muted{color:#69758a;font-size:13px}.time{color:#405cad;font-size:13px}.tag{background:#eef2fa;padding:2px 7px;border-radius:4px}@media(max-width:700px){main{padding:12px}.cols{grid-template-columns:1fr}}@media print{.toolbar,video,.actions,.editor,summary,header input{display:none}.row{break-inside:avoid;border:0;border-bottom:1px solid #ddd}.cols{grid-template-columns:1fr 1fr}}
</style></head><body><main><header><h1 id="title"></h1><p class="muted">原声识别与中文对照 · 人物确认和文字校对分别记录。保存 HTML 副本后可导回 AnimeDialog。</p><label>选择本地视频 <input id="file" type="file" accept="video/*"></label><video id="video" controls></video><div class="actions"><button id="save">保存 HTML 副本</button><button id="txt">导出人物分类文本</button><button id="print">打印</button></div><div id="message" class="status" role="status"></div></header><div class="toolbar"><input id="search" type="search" placeholder="搜索台词或人物"><select id="episode" aria-label="剧集筛选"></select><select id="person" aria-label="人物筛选"></select><label><input id="pending" type="checkbox">人物待复核</label><label><input id="group" type="checkbox">按人物分组</label></div><p id="count" class="muted"></p><div id="rows"></div></main><script id="animedialog-project" type="application/json">__PROJECT__</script><script>
'use strict';const project=JSON.parse(document.getElementById('animedialog-project').textContent),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=new Map(project.characters.map(c=>[c.id,c.name])),episodeNames=new Map(project.episodes.map(e=>[e.id,e.title]));const time=ms=>[Math.floor(ms/3600000),Math.floor(ms/60000)%60,Math.floor(ms/1000)%60].map(x=>String(x).padStart(2,'0')).join(':');const role=r=>r.character_ids.map(id=>names.get(id)||'待确认').join('／')||'待确认';const base=new Map(project.rows.map(r=>[r.id,structuredClone(r)]));let url;
$('title').textContent=project.title+' 台词本';$('group').checked=!!project.grouped;
let hash=0;for(const r of project.rows)hash=(Math.imul(hash,31)+r.revision)>>>0;const key='animedialog:'+project.project_id+':'+location.pathname+':'+hash;
try{const cached=JSON.parse(localStorage.getItem(key)||'{}');for(const r of project.rows)if(cached[r.id])Object.assign(r,cached[r.id]);}catch(e){$('message').textContent='当前浏览器无法记住修改，请保存 HTML 副本。';}
const option=(id,name)=>`<option value="${esc(id)}">${esc(name)}</option>`;
$('person').innerHTML=option('','全部人物')+project.characters.map(c=>option(c.id,c.name)).join('');$('episode').innerHTML=option('','全部剧集')+project.episodes.map(e=>option(e.id,e.title)).join('');
function remember(){try{localStorage.setItem(key,JSON.stringify(Object.fromEntries(project.rows.filter(r=>r.html_edited).map(r=>[r.id,r]))));}catch(e){$('message').textContent='请保存 HTML 副本留存修改。';}}
function render(){const q=$('search').value.toLowerCase();let rows=project.rows.filter(r=>!r.deleted&&(!$('episode').value||r.episode_id===$('episode').value)&&(!$('person').value||r.character_ids.includes($('person').value))&&(!$('pending').checked||r.speaker_review!=='confirmed')&&(!q||(r.original+' '+r.translation+' '+role(r)).toLowerCase().includes(q)));if($('group').checked)rows.sort((a,b)=>role(a).localeCompare(role(b),'zh-CN')||a.start_ms-b.start_ms);let priorGroup='';$('count').textContent=`显示 ${rows.length} / ${project.rows.filter(r=>!r.deleted).length} 条`;$('rows').innerHTML=rows.map(r=>`${$('group').checked&&priorGroup!==role(r)?'<h2>'+esc(priorGroup=role(r))+'</h2>':''}<article class="row" data-id="${r.id}"><div class="meta"><button class="time" data-seek="${r.start_ms}">${time(r.start_ms)} – ${time(r.end_ms)}</button><strong>${esc(role(r))}</strong><span>${esc(episodeNames.get(r.episode_id))}</span><span>${esc(r.kind)}</span><span class="tag">人物${r.speaker_review==='confirmed'?'已确认':'待复核'} / 文字${r.text_review==='confirmed'?'已校对':'待校对'}</span></div><div class="cols"><div><div class="label">原声文字</div><div class="text">${esc(r.original)}</div></div><div><div class="label">中文 ${esc(r.translation_source)}</div><div class="text">${esc(r.translation)}</div></div></div>${r.turns.length?`<p class="text muted">${r.turns.map(t=>`${esc(names.get(t.character_id)||'待确认')}：${esc(t.text)} ${t.start_ms==null?'（时间待核）':time(t.start_ms)}`).join('<br>')}</p>`:''}<p class="muted">${r.evidence.map(esc).join('；')}</p><details><summary>人工审核与修改</summary><div class="editor"><div class="cols"><label>原声文字<textarea data-field="original">${esc(r.original)}</textarea></label><label>中文<textarea data-field="translation">${esc(r.translation)}</textarea></label></div><div class="actions"><label>整段人物 <select data-field="person" data-current="${r.character_ids.length===1&&!r.turns.length?r.character_ids[0]:''}">${option('','待确认')+project.characters.map(c=>`<option value="${c.id}"${r.character_ids.length===1&&!r.turns.length&&r.character_ids[0]===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label><input data-field="speaker_review" type="checkbox"${r.speaker_review==='confirmed'?' checked':''}>人物已确认</label><label><input data-field="text_review" type="checkbox"${r.text_review==='confirmed'?' checked':''}>文字已校对</label></div>${r.turns.length?`<p class="muted">已有多人分句：保留整段人物为待确认可继续编辑分句；选择整段人物会替换分句归属。</p>${r.turns.map((t,i)=>`<label>${esc(t.text)} <select data-turn="${i}">${option('','待确认')+project.characters.map(c=>`<option value="${c.id}"${t.character_id===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></label><br>`).join('')}`:''}<label>备注<textarea data-field="notes">${esc(r.notes)}</textarea></label><div class="actions"><button data-apply="${r.id}">保存本条修改</button><button data-undo="${r.id}">恢复导出时版本</button></div></div></details></article>`).join('')||'<div class="row">没有符合条件的台词。</div>';}
$('rows').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.seek){if(!$('video').src){$('message').textContent='请先选择这集对应的本地视频。';return;}$('video').currentTime=Number(b.dataset.seek)/1000;$('video').play().catch(()=>{});return;}const id=b.dataset.apply||b.dataset.undo;if(!id)return;const r=project.rows.find(r=>r.id===id);if(b.dataset.undo){const prior=structuredClone(base.get(id));prior.revision=r.revision+1;prior.html_edited=true;Object.assign(r,prior);}else{const box=b.closest('article'),field=x=>box.querySelector(`[data-field="${x}"]`);const oldTranslation=r.translation;r.original=field('original').value;r.translation=field('translation').value;r.notes=field('notes').value;const who=field('person').value;if(who!==field('person').dataset.current){r.character_ids=who?[who]:[];r.turns=[];}else if(r.turns.length){r.turns.forEach((t,i)=>{const cid=box.querySelector(`[data-turn="${i}"]`).value||null;if(cid!==t.character_id)t.review=cid?'confirmed':'pending';t.character_id=cid;});r.character_ids=[...new Set(r.turns.map(t=>t.character_id).filter(Boolean))];}let changedParts=false;if(r.turns.length&&oldTranslation!==r.translation){const lines=r.translation.split(/\r?\n/).filter(s=>s.trim());if(lines.length===r.turns.length){r.turns.forEach((t,i)=>{if(t.text!==lines[i]){t.text=lines[i];t.review='pending';}});}else{r.turns=[];r.flags=[...new Set([...r.flags,'整段中文结构已修改，请重新分句核对人物'])];}changedParts=true;}r.speaker_review=!changedParts&&field('speaker_review').checked&&(r.character_ids.length===1||r.turns.length&&r.turns.every(t=>t.character_id&&t.review==='confirmed'))?'confirmed':'pending';r.text_review=field('text_review').checked?'confirmed':'pending';r.evidence=[...new Set([...r.evidence,'HTML人工修改，请结合文字与人物审核状态核对'])];r.html_edited=true;r.revision++;}remember();render();$('message').textContent='修改已记录，请保存 HTML 副本后导回软件。';});
for(const id of ['search','person','episode','pending','group'])$(id).addEventListener(id==='search'?'input':'change',render);
$('file').addEventListener('change',e=>{if(!e.target.files[0])return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(e.target.files[0]);$('video').src=url;});
function download(text,type,name){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);}
$('save').addEventListener('click',()=>{const root=document.documentElement.cloneNode(true);root.querySelector('#animedialog-project').textContent=JSON.stringify(project).replace(/</g,'\\u003c');root.querySelector('#rows').innerHTML='';root.querySelector('#video').removeAttribute('src');root.querySelector('#message').textContent='';download('<!doctype html>'+root.outerHTML,'text/html;charset=utf-8','AnimeDialog_人工核对.html');});
$('txt').addEventListener('click',()=>{const groups=new Map();for(const r of project.rows.filter(r=>!r.deleted)){const parts=r.turns.length?[...new Set(r.turns.map(t=>t.character_id))].map(cid=>({name:names.get(cid)||'待确认',zh:r.turns.filter(t=>t.character_id===cid).map(t=>t.text).join('\n'),note:'整段原文含其他人物，分句时间留空时使用整段定位。'})):[{name:role(r),zh:r.translation,note:''}];for(const part of parts){const k=part.name;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(`[${time(r.start_ms)}] 原文：${r.original}\n中文：${part.zh}\n人物：${r.speaker_review==='confirmed'?'已确认':'待复核'}；文字：${r.text_review==='confirmed'?'已校对':'待校对'}\n${part.note}`);}}download('\ufeff'+[...groups].map(([k,rs])=>k+'\n'+rs.join('\n\n')).join('\n\n'),'text/plain;charset=utf-8','AnimeDialog_人物分类.txt');});$('print').addEventListener('click',()=>print());render();
</script></body></html>
